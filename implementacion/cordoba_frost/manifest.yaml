# Copiar esta carpeta a implementacion/{schema_name}/ y completar.
# Campos obligatorios marcados con ★

schema_name: "cordoba_frost"              # ★ Nombre del schema en Supabase (ej: al_fuego)
nombre_comercial: "Córdoba Frost"         # ★ Nombre visible del tenant (ej: Al Fuego)
ciudad_base: "Córdoba, Argentina"              # ★ Ciudad de operaciones (ej: "Valle Escondido, Córdoba, Argentina")
coordenadas_centro: [-31.417, -64.183]       # ★ [lat, lon] del centro geográfico (ej: [-31.3547, -64.2442]) — usado en Fase 4
rubro: "Panadería congelada y helados"                    # ★ Descripción libre del rubro (ej: "carnicería / parrilla") — usado en Fase 4
excel_input: "inputs/PRODUCTOS-GRAL.xlsx"
sitio_web: "https://www.cordobafrost.com/"                # URL del sitio web del cliente (ej: https://alfuego.com.ar/)
notas: "Tenant productivo (delta, no implementación de 0). No inventar promos/clientes/pedidos mock. Foco 2026-09-01: catálogo GRAL, categorías, prompt y fotos. Combos helados y ENVIO-DOM conservados."

blocked:
  is_mock_migration: false  # pasar a false tras aplicar docs/implementacion/migrations/20260615_add_is_mock_columns_demo_and_tenants.sql


fases:
  "00":
    nombre: preflight
    estado: cargado  # pendiente | en_curso | csv_listo | cargado | bloqueado
    output_csv: outputs/phase-00-preflight.csv
    filas_csv: 8
    cargado_at: "2026-07-21T09:22:00Z"
  "01":
    nombre: catalogo
    estado: cargado
    output_csv: outputs/phase-01-productos-gral.csv
    output_csv_extra: outputs/phase-01-combos-helados-agosto-2026.csv
    filas_csv: 279
    cargado_at: "2026-09-01T13:44:22Z"
    notas: "279 SKUs GRAL + 3 combos panadería ya existían. Fotos 2026-09-01: 192 del Excel + 3 PNG combos helados = 195 image_url. 90 SKUs del Excel sin foto embebida."
  "01.1":
    nombre: tags
    estado: cargado
    output_json: outputs/phase-01-1-propuesta-categorias.json
    cargado_at: "2026-09-01T14:17:01Z"
  "01.2":
    nombre: mejora_descripciones
    estado: cargado
    output_csv: outputs/vista_previa_enriquecimiento.csv
    filas_csv: 279
    cargado_at: "2026-09-01T19:50:00Z"
    notas: "279/279 descripciones aplicadas + 983 aliases upsert (SKUs del alta GRAL). Vectorize encolada HTTP 200. Combos helados y ENVIO-DOM no tocados."
  "01.3":
    nombre: prompt_agente
    estado: cargado
    output_json: outputs/phase-01-3-prompt-config.json
    cargado_at: "2026-09-01T21:37:10Z"
    notas: "v2 system_prompt + agent_base_prompt_client + recepcionista. Catálogo ~285 SKUs (ya no solo 6 combos). Teléfono y reglas_negocio (fulfillment/notif) conservados."
  "02":
    nombre: promociones
    estado: omitido
    output_csv: outputs/phase-02-promociones.csv
    filas_csv: 0
    cargado_at: null
    notas: "Omitido 2026-09-01: no hay promociones semanales reales. No cargar mocks. Combos de campaña siguen como SKUs de catálogo."
  "03":
    nombre: cross_upsell
    estado: pendiente
    output_csv: outputs/phase-03-cross-sell.csv
    output_csv_extra: outputs/phase-03-up-sell.csv
    filas_csv: 0
    cargado_at: null
  "04":
    nombre: red_comercial
    estado: pendiente
    output_csv: outputs/phase-04-vendedores.csv
    output_csv_extra: outputs/phase-04-zonas.csv
    output_csv_extra_2: outputs/phase-04-clientes.csv
    filas_csv: 0
    cargado_at: null
  "05":
    nombre: clientes_flags
    estado: pendiente
    output_csv: outputs/phase-05-clientes-flags.csv
    filas_csv: 0
    cargado_at: null
  "06":
    nombre: pedidos
    estado: pendiente
    output_csv: outputs/phase-06-pedidos.csv
    output_csv_extra: outputs/phase-06-items-pedido.csv
    filas_csv: 0
    cargado_at: null
  "06.1":
    nombre: field_setup
    estado: pendiente
    output_csv: outputs/phase-06-1-pedidos-field.csv
    output_csv_extra: outputs/phase-06-1-items-pedido-field.csv
    output_json: outputs/phase-06-1-objetivos.csv
    filas_csv: 0
    cargado_at: null
    ml_retrained: false          # true si retrain_ml.py completó con rows_used > 0
    ml_warning: null             # Mensaje si el servicio ML estaba caído
  "07":
    nombre: conversaciones
    estado: pendiente
    output_csv: outputs/phase-07-conversaciones-resumen.csv
    filas_csv: 0
    cargado_at: null
  "08":
    nombre: insights
    estado: pendiente
    output_csv: outputs/phase-08-notificaciones.csv
    filas_csv: 0
    cargado_at: null
  "09":
    nombre: e2e_testing
    estado: pendiente
    output_markdown: outputs/reporte_e2e_*.md
    cargado_at: null
  "10":
    nombre: purga_mock
    estado: bloqueado
    output_csv: outputs/phase-10-purga-log.csv
    filas_csv: 0
    cargado_at: null

