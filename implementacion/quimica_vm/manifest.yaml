sitio_web: ""
notas: |
  Fábrica-distribuidora en Villa María. Línea propia de líquidos + primeras marcas para el hogar.
  7 sucursales en Córdoba + 1 en Santa Fe; camiones a San Luis, Entre Ríos, La Pampa, Río Negro y San Juan.
  Cliente típico: revendedor. Compra mínima mayorista $120.000; envío a domicilio $350.000.
  Precios de lista revendedor septiembre 2026, SIN IVA, por litro salvo aclaración.
  Envases retornables. L.P.U. = listo para usar. Fórmulas 1+N = concentrado a diluir.
  ERP: GDS. Casos de uso: carga automática de pedidos, campañas WhatsApp por visita de camión, ads.

